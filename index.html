<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoastBox by Noxhel Studios</title>
<meta name="description" content="RoastBox is a pass-the-phone party game: lock a secret truth, pass the phone, and let the AI judge roast the guesses.">
<style>
  :root { --bg:#F8E100; --ink:#060606; --pink:#D6007A; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  main { max-width:520px; background:#FAF9F1; border:3px solid var(--ink); box-shadow:8px 8px 0 var(--ink); padding:28px; }
  h1 { margin:0 0 .3em; font-size:2rem; letter-spacing:-.02em; }
  p { margin:.4em 0 1em; }
  a { display:inline-block; margin:4px 8px 4px 0; padding:8px 14px; border:3px solid var(--ink); background:var(--pink); color:#fff; font-weight:700; text-decoration:none; box-shadow:3px 3px 0 var(--ink); }
  small { display:block; margin-top:1.2em; opacity:.7; }
</style>
</head>
<body>
<main>
  <h1>ROASTBOX</h1>
  <p>One phone. Bad guesses. Public consequences. A pass-the-phone party game for 3 to 8 friends, judged by AI.</p>
  <p>
    <a href="privacy.html#en">Privacy Policy</a>
    <a href="privacy.html#tr">Gizlilik Politikası</a>
  </p>
  <small>© 2026 Noxhel Studios · <a style="all:unset;color:inherit;text-decoration:underline;cursor:pointer" href="mailto:support@roastbox.io">support@roastbox.io</a></small>
</main>
</body>
</html>
